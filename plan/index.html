:root{
  color-scheme:light;
  --navy:#2d3f5e; --midnight:#1c2a44; --slate:#7a8fa8; --muted:#5b6f8a;
  --lavender:#d4d8e8; --paper:#f4f6f9; --cool:#e9ecf2; --card:#ffffff;
  --hair:rgba(45,63,94,.14);          /* decorative hairlines */
  --edge:rgba(45,63,94,.6);           /* control borders, 3:1 on paper */
  --serif:"Cormorant Garamond",Georgia,"Times New Roman",serif;
  --sans:"Hurme Sans","Avenir Next","Century Gothic",system-ui,sans-serif;
  --shadow-card:0 1px 2px rgba(28,42,68,.06),0 12px 32px -12px rgba(28,42,68,.18);
  --deboss:inset 0 1px 3px rgba(45,63,94,.22),0 1px 0 rgba(255,255,255,.8);
  --ease:cubic-bezier(.22,.61,.36,1);
  --top:64px;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-snap-type:y proximity;-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--paper);color:var(--navy);
  font-family:var(--sans);font-size:16px;line-height:1.55;
  -webkit-font-smoothing:antialiased;
  padding-bottom:env(safe-area-inset-bottom,0px);
}
button,input,select{font:inherit;color:inherit}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- top bar ---------- */
.top{
  position:sticky;top:0;z-index:30;height:var(--top);
  padding:env(safe-area-inset-top,0px) 22px 0;background:var(--paper);
  display:flex;align-items:center;justify-content:space-between;gap:16px;
}
.top::before{content:"";position:absolute;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--paper)}
.logo{display:block;line-height:0;transition:opacity 320ms var(--ease)}
.logo img{display:block;height:26px;width:auto}
body.on-welcome .logo{opacity:0;pointer-events:none}
.count{margin:0;font-size:12px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}
.prog{position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--hair)}
.prog i{display:block;height:100%;width:0;background:var(--navy);transition:width 320ms var(--ease)}

/* ---------- sections ---------- */
.q{
  min-height:100vh;min-height:100svh;
  display:flex;align-items:center;
  padding:calc(var(--top) + 28px) 22px 88px;
  margin-top:calc(var(--top) * -1);
  scroll-snap-align:start;
}
.q[hidden]{display:none}
.inner{width:100%;max-width:680px;margin:0 auto}
.q.wide .inner{max-width:980px}
.eyebrow{
  display:flex;align-items:center;gap:10px;margin:0 0 16px;
  font-size:13px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);
}
.eyebrow svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.q-title{
  margin:0 0 12px;font-family:var(--serif);font-weight:600;
  font-size:clamp(38px,8.4vw,60px);line-height:1.04;letter-spacing:-.02em;text-wrap:balance;
}
.q-title:focus{outline:none}
.hint{margin:0 0 30px;max-width:48ch;font-size:16px;color:var(--muted);text-wrap:pretty}
.note{margin:12px 0 0;font-size:14px;line-height:1.5;color:var(--muted);text-wrap:pretty}
.note.err{color:#a32117}

/* ---------- welcome ---------- */
.welcome .inner{text-align:left}
.welcome .big{display:block;width:min(440px,78vw);height:auto;margin:0 0 30px -6px}
.welcome .q-title{font-size:clamp(44px,10vw,76px)}
.welcome .lead{font-size:19px;max-width:34ch;margin:0 0 30px;color:var(--navy)}
.welcome .small{margin:22px 0 0;font-size:13.5px;color:var(--muted);max-width:44ch}

/* ---------- options ---------- */
.opts{display:grid;gap:10px;grid-template-columns:1fr}
@media (min-width:600px){.opts.cols{grid-template-columns:1fr 1fr}}
.opt{position:relative;display:block}
.opt input{position:absolute;opacity:0;width:1px;height:1px}
.opt .pill{
  display:flex;align-items:center;gap:14px;min-height:58px;padding:12px 22px 12px 14px;
  background:var(--card);border:1px solid var(--edge);border-radius:999px;cursor:pointer;
  transition:background 160ms var(--ease),border-color 160ms var(--ease),color 160ms var(--ease);
}
.opt .k{
  flex:0 0 28px;height:28px;display:grid;place-items:center;border-radius:8px;
  border:1px solid var(--hair);background:var(--paper);
  font-size:12px;font-weight:600;color:var(--muted);transition:inherit;
}
.opt .t{display:block;line-height:1.25}
.opt .t em{display:block;margin-top:1px;font-style:normal;font-size:13px;color:var(--muted);transition:color 160ms var(--ease)}
.opt:hover .pill{border-color:var(--navy)}
.opt input:focus-visible + .pill{outline:3px solid var(--slate);outline-offset:3px}
.opt input:checked + .pill{background:var(--navy);border-color:var(--navy);color:var(--paper);box-shadow:var(--deboss)}
.opt input:checked + .pill .k{background:transparent;border-color:rgba(244,246,249,.5);color:var(--paper)}
.opt input:checked + .pill .t em{color:var(--lavender)}

/* ---------- fields ---------- */
.field{display:block;max-width:420px}
.field label{display:block;margin-bottom:8px;font-size:13px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.field input{
  display:block;width:100%;min-height:56px;padding:14px 16px;font-size:18px;
  background:var(--card);border:1px solid var(--edge);border-radius:8px;
}
.field input:focus-visible{outline:3px solid var(--slate);outline-offset:2px;border-color:var(--navy)}

/* ---------- buttons ---------- */
.nav{display:flex;align-items:center;gap:16px;margin-top:30px;flex-wrap:wrap}
.btn{
  min-height:54px;padding:14px 34px;border:0;border-radius:999px;cursor:pointer;
  background:var(--navy);color:var(--paper);font-size:15px;font-weight:600;letter-spacing:.02em;
  transition:background 160ms var(--ease);
}
.btn:hover{background:var(--midnight)}
.btn:active{box-shadow:var(--deboss)}
.btn:focus-visible{outline:3px solid var(--slate);outline-offset:3px}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.enter{font-size:13px;color:var(--muted)}
.enter b{font-weight:600}
@media (hover:none){.enter{display:none}}
.link{background:none;border:0;padding:12px 2px;color:var(--muted);font-size:14px;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.link:focus-visible{outline:3px solid var(--slate);outline-offset:2px}

/* ---------- tier cards ---------- */
.tiers{display:grid;gap:14px;grid-template-columns:1fr}
@media (min-width:860px){.tiers{grid-template-columns:repeat(3,1fr)}}
.tier{position:relative;display:block}
.tier input{position:absolute;opacity:0;width:1px;height:1px}
.tier .card{
  position:relative;display:flex;flex-direction:column;height:100%;padding:24px 22px 22px;
  background:var(--card);border:1px solid var(--hair);border-radius:16px;box-shadow:var(--shadow-card);cursor:pointer;
  transition:box-shadow 160ms var(--ease),border-color 160ms var(--ease);
}
.tier:hover .card{border-color:var(--edge)}
.tier input:focus-visible + .card{outline:3px solid var(--slate);outline-offset:3px}
.tier input:checked + .card{border-color:var(--navy);box-shadow:inset 0 0 0 2px var(--navy),var(--shadow-card)}
.tier input:disabled + .card{opacity:.46;cursor:not-allowed;box-shadow:none}
.tier .sel{position:absolute;top:20px;right:20px;width:24px;height:24px;border-radius:50%;border:1.5px solid var(--edge);display:grid;place-items:center}
.tier input:checked + .card .sel{background:var(--navy);border-color:var(--navy)}
.tier input:checked + .card .sel::after{content:"";width:10px;height:6px;border-left:2px solid var(--paper);border-bottom:2px solid var(--paper);transform:rotate(-45deg) translateY(-1px)}
.tier .nm{display:block;margin:0;font-family:var(--serif);font-weight:600;font-size:38px;line-height:1;letter-spacing:-.02em}
.tier .pr{display:block;margin:6px 0 4px;font-size:15px;font-weight:600}
.tier .pr small{font-size:12px;font-weight:400;color:var(--muted);letter-spacing:.04em}
.tier .pm{display:block;margin:0 0 16px;font-family:var(--serif);font-style:italic;font-size:19px;line-height:1.2;color:var(--muted)}
.tier .ul{display:block;margin:0;padding:16px 0 0;border-top:1px solid var(--hair);font-size:14px;line-height:1.45}
.tier .li{display:block;position:relative;padding:0 0 7px 16px}
.tier .li::before{content:"";position:absolute;left:0;top:.62em;width:5px;height:5px;border-radius:50%;background:var(--slate)}
.tier .na{display:block;margin:12px 0 0;font-size:13px;color:var(--muted)}

/* ---------- add-ons ---------- */
.addons{display:grid;gap:10px}
.addon{position:relative;display:block}
.addon input{position:absolute;opacity:0;width:1px;height:1px}
.addon .row{
  display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:64px;padding:12px 20px 12px 16px;
  background:var(--card);border:1px solid var(--edge);border-radius:16px;cursor:pointer;
  transition:background 160ms var(--ease),border-color 160ms var(--ease);
}
.addon:hover .row{border-color:var(--navy)}
.addon input:focus-visible + .row{outline:3px solid var(--slate);outline-offset:3px}
.addon input:checked + .row{background:var(--cool);border-color:var(--navy)}
.addon .who{display:flex;align-items:center;gap:14px}
.addon .tick{flex:0 0 24px;height:24px;border:1.5px solid var(--edge);border-radius:6px;display:grid;place-items:center;background:var(--card)}
.addon input:checked + .row .tick{background:var(--navy);border-color:var(--navy)}
.addon input:checked + .row .tick::after{content:"";width:11px;height:6px;border-left:2px solid var(--paper);border-bottom:2px solid var(--paper);transform:rotate(-45deg) translateY(-1px)}
.addon .nm{display:block;line-height:1.25}
.addon .nm em{display:block;margin-top:1px;font-style:normal;font-size:13px;color:var(--muted)}
.addon .amt{font-weight:600;font-size:15px;white-space:nowrap}

/* ---------- result ---------- */
.res .q-title{font-size:clamp(46px,10vw,72px)}
.sum{margin:0 0 26px;font-family:var(--serif);font-style:italic;font-size:22px;line-height:1.35;color:var(--navy);text-wrap:pretty}
.lines{border-top:1px solid var(--navy)}
.line{display:flex;justify-content:space-between;gap:20px;padding:15px 0;border-bottom:1px solid var(--hair);font-size:15px}
.line .what{max-width:68%}
.line .what em{display:block;margin-top:2px;font-style:normal;font-size:13px;color:var(--muted)}
.line .cost{font-weight:600;white-space:nowrap}
.total{
  display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-top:20px;padding:22px 26px;
  background:var(--navy);color:var(--paper);border-radius:16px;box-shadow:var(--shadow-card);
}
.total .lbl{font-size:13px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--lavender)}
.total .amt{font-family:var(--serif);font-weight:600;font-size:clamp(44px,10vw,62px);line-height:1;letter-spacing:-.02em}
.incl{margin-top:22px;padding:18px 22px;background:var(--cool);border-radius:16px;font-size:14px;line-height:1.55}
.incl b{display:block;margin-bottom:6px;font-size:12px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}
.form{margin-top:34px;padding:28px 26px 26px;background:var(--card);border:1px solid var(--hair);border-radius:16px;box-shadow:var(--shadow-card)}
.form h3{margin:0 0 6px;font-family:var(--serif);font-weight:600;font-size:34px;line-height:1.05;letter-spacing:-.02em}
.form .hint{margin-bottom:22px}
.grid2{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.form .field{max-width:none}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.ok{margin:0;font-family:var(--serif);font-size:30px;line-height:1.2;text-wrap:pretty}
.foot{margin-top:44px;padding-top:20px;border-top:1px solid var(--hair);display:flex;flex-wrap:wrap;gap:6px 20px;justify-content:space-between;font-size:13px;color:var(--muted)}
.foot a{color:inherit}

/* ---------- floating controls ---------- */
.float{
  position:fixed;z-index:25;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));
  display:flex;align-items:center;gap:10px;
}
.float button{cursor:pointer}
.arrows{display:flex;border-radius:999px;background:var(--navy);box-shadow:var(--shadow-card)}
.arrows button{
  width:46px;height:46px;display:grid;place-items:center;border:0;background:transparent;color:var(--paper);border-radius:999px;
}
.arrows button:hover{background:var(--midnight)}
.arrows button[disabled]{opacity:.35;cursor:not-allowed}
.arrows button:focus-visible{outline:3px solid var(--slate);outline-offset:2px}
.arrows svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.jump{
  min-height:46px;padding:0 20px;border:1px solid var(--navy);border-radius:999px;background:var(--card);color:var(--navy);
  font-size:14px;font-weight:600;box-shadow:var(--shadow-card);
}
.jump:hover{background:var(--cool)}
.jump:focus-visible{outline:3px solid var(--slate);outline-offset:3px}
.jump[hidden]{display:none}

@media (prefers-reduced-motion:reduce){
  *{transition:none!important;scroll-behavior:auto!important}
  html{scroll-snap-type:none}
}
</style>
</head>

const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => Array.from(r.querySelectorAll(s));
const money = n => '$' + Math.round(n).toLocaleString('en-US');
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const bandFor = g => PRICING.bands.find(b => g <= b.max) || null;
const tierById = id => PRICING.tiers.find(t => t.id === id);
const parseDate = v => { const p = String(v||'').split('-'); return p.length === 3 ? new Date(+p[0], +p[1]-1, +p[2]) : null; };
const ymd = d => d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
const todayStart = () => { const t = new Date(); t.setHours(0,0,0,0); return t; };
const isNye  = d => !!d && d.getMonth() === PRICING.nye.month && d.getDate() === PRICING.nye.day;
const isPeak = d => !!d && PRICING.peak.months.includes(d.getMonth()) && d.getDay() === PRICING.peak.weekday;
const prettyDate = d => d ? d.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'}) : '';
const norm = s => String(s||'').toLowerCase().replace(/,?\s*(ca|california)\s*$/,'').replace(/[^a-z ]/g,' ').replace(/\s+/g,' ').trim();
const CITY_INDEX = {}; PRICING.cities.forEach(([n,m]) => { CITY_INDEX[norm(n)] = { name:n, miles:m }; });

function resolvePlace(raw){
  const v = String(raw||'').trim();
  if(/^\d{5}$/.test(v)){ return PRICING.zips[v] !== undefined ? { label:v, miles:PRICING.zips[v] } : null; }
  const c = CITY_INDEX[norm(v)];
  return c ? { label:c.name, miles:c.miles } : null;
}
function milesNow(){
  if(S.miles !== null) return S.miles;
  const b = MILE_BANDS.find(m => m.id === S.milesBand);
  return b ? b.miles : null;
}
function travelFee(miles){
  return miles && miles > PRICING.travel.freeMiles ? (miles - PRICING.travel.freeMiles) * PRICING.travel.perMile : 0;
}

/* ---------- the quote ---------- */
function quote(){
  const d = parseDate(S.date), band = bandFor(S.guests), tier = tierById(S.tier), miles = milesNow();
  if(!S.guests || !S.tier || !d || (S.miles === null && !S.milesBand)) return { incomplete:true };
  const custom = (S.guests > PRICING.maxGuests) || S.milesBand === 'far' || (S.miles !== null && S.miles > PRICING.travel.customBeyond);
  if(custom || !band || !tier) return { custom:true };

  const lines = [];
  lines.push({ what:`The ${tier.name}`, sub:`${band.label} guests · ${band.team}`, cost:tier.price[band.id] });

  const hr = PRICING.hours.options.find(o => o.h === S.hours);
  if(hr && hr.delta !== 0){
    const diff = S.hours - PRICING.hours.base;
    lines.push({ what:`${S.hours} hours of service`,
      sub: diff > 0 ? `${diff} beyond our standard four` : 'One under our standard four', cost:hr.delta });
  }
  S.addons.forEach(id => {
    const a = PRICING.addons.find(x => x.id === id); if(!a) return;
    lines.push({ what:a.name,
      sub: a.kind === 'perGuest' ? `${money(a.amount)} per guest, priced for ${band.max}` : '',
      cost: a.kind === 'perGuest' ? a.amount * band.max : a.amount });
  });
  const tf = travelFee(miles);
  if(tf > 0) lines.push({ what:'Travel', sub:`${miles} miles · the first ${PRICING.travel.freeMiles} are included`, cost:tf });

  let total = lines.reduce((s,l) => s + l.cost, 0);
  const floor = tier.price[PRICING.bands[0].id];
  let floorApplied = false, peakApplied = false;
  if(total < floor){ total = floor; floorApplied = true; }
  if(isPeak(d) && total < PRICING.peak.minimum){ total = PRICING.peak.minimum; peakApplied = true; }

  return { custom:false, lines, total, floor, floorApplied, peakApplied, band, tier,
           customised: S.addons.length > 0 || S.hours !== PRICING.hours.base };
}

}

      </div>

      <div class="nav"><button class="btn" type="submit" id="bksend">Send it</button></div>
    </form>
  </div>
  <div class="foot"><span>VIBZ · El Dorado Hills &amp; greater Sacramento</span>

    <button type="button" class="link" id="restart">Start over</button></div>`;
}

async function submitForm(e){
  e.preventDefault();
  const f = e.target, err = $('#bkerr'), btn = $('#bksend');
  const name = f.elements.name.value.trim(), email = f.elements.email.value.trim();
  if(!name || !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){ err.textContent = 'A name and a working email, and we are away.'; return; }
  err.textContent = ''; btn.disabled = true; btn.textContent = 'Sending…';

  const q = quote();
  const fd = new FormData(f);
  fd.append('occasion', S.occasion || '');
  fd.append('event_date', S.date || '');
  fd.append('place', S.placeLabel || S.place || '');
  fd.append('guests', String(S.guests || ''));
  fd.append('hours', String(S.hours));
  fd.append('package', S.tier ? tierById(S.tier).name : '');
  fd.append('addons', S.addons.join(', '));
  fd.append('quote', q.custom ? 'Custom: over 100 guests or beyond 60 miles' : money(q.total));
  fd.append('_subject', `VIBZ configurator: ${S.occasion || 'enquiry'} ${S.date || ''}`);
  try{
    const res = await fetch(PRICING.formEndpoint, { method:'POST', headers:{Accept:'application/json'}, body:fd });
    if(!res.ok) throw new Error('status ' + res.status);
    $('#formwrap').innerHTML = '<p class="ok">Thank you. We have your night, and we will be back inside 48 hours.</p>';
    $('#live').textContent = 'Your request was sent.';
  }catch(x){
    btn.disabled = false; btn.textContent = 'Send it';
    err.innerHTML = 'That did not send. Email <a href="mailto:hello@vibzbar.com">hello@vibzbar.com</a> and we will pick it up.';
  }
}

function paint(i){
  const def = SECTIONS[i], el = def.el, c = def.content();
  el.className = 'q' + (def.wide ? ' wide' : '') + (def.id === 'welcome' ? ' welcome' : '') + (def.result ? ' res' : '');
  el.innerHTML = layout(def, i, c);
  el.setAttribute('aria-labelledby', 't-' + def.id);
  if(def.wire) def.wire(el);
  refreshOk(i);
}
function refreshOk(i){
  const b = $(`[data-ok="${i}"]`, SECTIONS[i].el);
  if(b) b.disabled = !SECTIONS[i].ready();
}

function build(){
  if(io) io.disconnect();
  flow.innerHTML = '';
  SECTIONS.forEach((def, i) => {
    const el = document.createElement('section');
    el.id = 's-' + def.id; el.dataset.i = i; el.hidden = i > reached;
    flow.appendChild(el); def.el = el; paint(i);
    if(io) io.observe(el);
  });
}

/* A answer changed in section `src`. Repaint what depends on it, leave the section being typed in. */
function changed(src){
  refreshOk(src);
  [6, 7, 8].forEach(i => { if(i !== src && i <= reached) paint(i); });
  /* an earlier edit can invalidate later readiness: keep OK buttons honest */
  SECTIONS.forEach((_, i) => { if(i !== src) refreshOk(i); });
  save(); updateUI();
}

function advance(i){
  const n = i + 1; if(n >= SECTIONS.length) return;
  const fresh = n > reached;
  if(fresh){ reached = n; SECTIONS[n].el.hidden = false; paint(n); }
  save(); updateUI();
  if(fresh) setTimeout(() => go(n), 180);
}
function go(i){
  const el = SECTIONS[i] && SECTIONS[i].el; if(!el || el.hidden) return;
  el.scrollIntoView({ behavior: REDUCE ? 'auto' : 'smooth', block:'start' });
  setTimeout(() => {
    const t = $('.q-title', el);
    if(FINE_POINTER){ const inp = $('input[type=text],input[type=number],input[type=date]', el); if(inp){ inp.focus({preventScroll:true}); return; } }
    if(t) t.focus({preventScroll:true});
  }, REDUCE ? 0 : 520);
  $('#live').textContent = (SECTIONS[i].content().title || '');
}

function restart(){
  S = blank(); reached = 0; active = 0;
  try{ sessionStorage.removeItem('vibz.plan.v2'); }catch(e){}
  build(); updateUI(); window.scrollTo({ top:0, behavior: REDUCE ? 'auto' : 'smooth' });
}

/* ---------- chrome: progress, counter, arrows ---------- */
function updateUI(){
  const q = SECTIONS.length - 1;                       // last index = result
  document.body.classList.toggle('on-welcome', active === 0);
  $('#prog').style.width = (active / q * 100) + '%';
  $('#count').textContent = active === 0 ? '' : active === q ? 'Your night' : `${active} / ${q - 1}`;
  $('#up').disabled = active <= 0;
  $('#down').disabled = active >= reached;
  $('#jump').hidden = !(reached >= q && active < q && active > 0);
}
$('#up').addEventListener('click', () => go(Math.max(0, active - 1)));
$('#down').addEventListener('click', () => go(Math.min(reached, active + 1)));
$('#jump').addEventListener('click', () => go(SECTIONS.length - 1));

flow.addEventListener('click', e => {
  const b = e.target.closest('[data-ok]'); if(!b) return;
  const i = +b.dataset.ok; if(SECTIONS[i].ready()) advance(i);
});

document.addEventListener('keydown', e => {
  if(e.metaKey || e.ctrlKey || e.altKey) return;
  const t = e.target, tag = (t.tagName || '').toLowerCase();
  const el = SECTIONS[active] && SECTIONS[active].el; if(!el) return;
  if(e.key === 'Enter' && tag === 'input' && t.type !== 'submit' && el.contains(t) && !t.closest('#bk')){
    const b = $('[data-ok]', el); if(b && !b.disabled){ e.preventDefault(); b.click(); }
    return;
  }
  if(tag === 'input' || tag === 'textarea' || tag === 'select') return;
  const k = e.key.toUpperCase();
  const i = LETTERS.indexOf(k);
  if(k.length === 1 && i > -1){
    const lab = $$('.opt', el)[i]; if(lab && lab.offsetParent !== null){ const r = $('input', lab); if(r){ r.checked = true; r.dispatchEvent(new Event('change', {bubbles:true})); } }
  }
});

/* ---------- which section is on screen ---------- */
let io = null;
if('IntersectionObserver' in window){
  io = new IntersectionObserver(entries => {
    entries.forEach(en => { if(en.isIntersecting){ active = +en.target.dataset.i; updateUI(); } });
  }, { rootMargin:'-45% 0px -54% 0px', threshold:0 });
}

/* ---------- persistence ---------- */
function save(){ try{ sessionStorage.setItem('vibz.plan.v2', JSON.stringify({ S, reached })); }catch(e){} }
function restore(){
  try{
    const d = JSON.parse(sessionStorage.getItem('vibz.plan.v2') || 'null');
    if(d && d.S){ S = Object.assign(blank(), d.S); S.contact = Object.assign(blank().contact, d.S.contact||{}); reached = Math.min(+d.reached || 0, SECTIONS.length - 1); return true; }
  }catch(e){}
  return false;
}

const resumed = restore();
build();
updateUI();
if(resumed && reached > 0) setTimeout(() => SECTIONS[reached].el.scrollIntoView({ behavior:'auto', block:'start' }), 60);
</script>
</body>
